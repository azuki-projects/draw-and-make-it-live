<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Draw World — Live</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1220;color:#e2e8f0}
#game{position:fixed;inset:0;touch-action:none}
#map{display:block;width:100%;height:100%;background:#4ade80;touch-action:none}

/* ========== TOP HUD — AUTO RESPONSIVE, NEVER OVERLAPS ========== */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:10px;display:flex;flex-wrap:wrap;gap:8px;
  justify-content:space-between;align-items:flex-start;
  pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 70%);
}
.hud .group{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}
.chip{
  background:rgba(15,23,42,.65);backdrop-filter:blur(10px);
  padding:7px 12px;border-radius:999px;font-size:12px;
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;gap:7px;font-weight:600
}
.chip b{color:#4ade80}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(15,23,42,.65);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:.12s;pointer-events:auto
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{background:#3b82f6;border-color:transparent}

/* ========== MINIMAP — TOP RIGHT (below HUD on mobile) ========== */
.minimap{
  position:fixed;z-index:90;
  top:58px;right:10px;
  border-radius:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  background:#0f172a;transition:width .15s,height .15s
}
.minimap canvas{display:block;width:100%;height:100%}
.minimap .lbl{
  position:absolute;bottom:3px;left:6px;
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.7)
}

/* ========== ROBLOX-STYLE CHAT — TOP LEFT (scrollable, NO FADE) ========== */
.chat-wrap{
  position:fixed;z-index:80;
  top:58px;left:10px;
  width:min(310px,74vw);
  transition:opacity .2s, transform .2s
}
.chat-wrap.hidden{opacity:0;transform:translateX(-20px);pointer-events:none}
.chat-wrap.hidden + .chat-float{display:flex}

/* Floating chat button when hidden */
.chat-float{
  display:none;position:fixed;z-index:85;
  top:58px;left:10px;
  width:42px;height:42px;border-radius:50%;
  background:#3b82f6;color:#fff;border:0;
  font-size:18px;cursor:pointer;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(59,130,246,.45)
}
.chat-float .badge{
  position:absolute;top:-4px;right:-4px;
  background:#ef4444;color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;padding:0 5px;
  display:flex;align-items:center;justify-content:center
}

/* SCROLLABLE LOG — newest at BOTTOM like Roblox */
.log{
  height:min(34vh,260px);overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:2px;
  padding:8px;border-radius:10px 10px 0 0;
  background:rgba(15,23,42,var(--chat-alpha,.65));
  border:1px solid rgba(255,255,255,var(--chat-border,.1));
  backdrop-filter:blur(8px);
  scroll-behavior:smooth;
  -ms-overflow-style:none;scrollbar-width:thin
}
.log::-webkit-scrollbar{width:5px}
.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
.msg{
  padding:4px 8px;border-radius:6px;font-size:12.5px;line-height:1.35;
  word-wrap:break-word;animation:msgIn .18s ease-out;
  background:rgba(255,255,255,.03)
}
.msg b{color:#60a5fa;margin-right:4px;font-weight:700}
.msg.sys b{color:#facc15}
.msg.sys{background:rgba(250,204,21,.06)}
@keyframes msgIn{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}

.chatbar{
  display:flex;gap:6px;margin-top:0;
  padding:6px;border-radius:0 0 10px 10px;
  background:rgba(15,23,42,var(--chat-alpha,.65));
  border:1px solid rgba(255,255,255,var(--chat-border,.1));
  border-top:0;backdrop-filter:blur(8px)
}
.chatbar input{
  flex:1;padding:8px 10px;border-radius:7px;
  background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);
  color:#f1f5f9;font-size:13px;outline:none
}
.chatbar input:focus{border-color:#3b82f6}
.chatbar button{
  padding:0 12px;border-radius:7px;
  background:#3b82f6;color:#fff;font-weight:700;
  border:0;cursor:pointer;font-size:13px
}

/* RESIZABLE JOYSTICK */
.joy{
  position:fixed;left:18px;bottom:22px;z-index:70;
  border-radius:50%;
  background:rgba(15,23,42,.4);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  touch-action:none;user-select:none
}
.joy .nub{
  position:absolute;left:50%;top:50%;border-radius:50%;
  background:rgba(255,255,255,.88);
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:transform .08s
}

/* PLAYER — TRANSPARENT SQUARE */
.player{
  position:absolute;transform:translate(-50%,-50%);
  pointer-events:none;text-align:center;z-index:5
}
.player .av{
  width:56px;height:56px;display:block;margin:0 auto;
  image-rendering:-webkit-optimize-contrast;
  filter:drop-shadow(0 5px 9px rgba(0,0,0,.35))
}
.player .nm{
  margin-top:2px;background:rgba(15,23,42,.75);
  color:#fff;font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:999px;display:inline-block
}
.player.me .av{
  filter:drop-shadow(0 0 0 2px #facc15)
         drop-shadow(0 0 10px rgba(250,204,21,.45))
         drop-shadow(0 5px 9px rgba(0,0,0,.35))
}

/* ========== SINGLE BUBBLE ONLY (no stacking) ========== */
.bubble{
  position:absolute;left:50%;bottom:36px;
  transform:translateX(-50%);
  background:#fff;color:#0f172a;
  padding:5px 10px;border-radius:11px;
  font-size:12px;font-weight:600;line-height:1.25;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  max-width:200px;word-wrap:break-word;text-align:center;
  animation:bubbleIn .2s cubic-bezier(.2,1.4,.4,1);
  transition:opacity .35s, transform .35s
}
.bubble::after{
  content:'';position:absolute;left:50%;bottom:-5px;
  margin-left:-5px;
  border-left:5px solid transparent;
  border-right:5px solid transparent;
  border-top:5px solid #fff
}
.bubble.fading{opacity:0;transform:translate(-50%,-6px)}
@keyframes bubbleIn{
  from{transform:translate(-50%,6px) scale(.7);opacity:0}
  to{transform:translate(-50%,0) scale(1);opacity:1}
}

/* ========== SETTINGS MODAL — ALL 4 SLIDERS VISIBLE ========== */
.modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(2,6,23,.75);backdrop-filter:blur(5px);
  display:none;align-items:center;justify-content:center;padding:16px
}
.modal.open{display:flex}
.modal .card{
  width:min(380px,100%);max-height:92vh;overflow-y:auto;
  background:#0f172a;border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.6)
}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .sub{color:#94a3b8;font-size:12px;margin:0 0 16px}
.set-row{margin-bottom:14px}
.set-row label{
  display:block;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#94a3b8;font-weight:600;margin-bottom:6px
}
.set-row .val{float:right;color:#60a5fa;font-weight:700}
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:6px;border-radius:999px;
  background:#334155;outline:none
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#3b82f6;border:2px solid #fff;cursor:pointer
}
.modal .actions{display:flex;gap:8px;margin-top:8px}
.modal button{
  flex:1;padding:11px;border-radius:11px;
  font-weight:700;border:0;cursor:pointer;font-size:13px
}
.modal .save{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
.modal .reset{background:#1e293b;color:#cbd5e1;border:1px solid rgba(255,255,255,.08)}

.keys{
  position:fixed;left:170px;bottom:26px;z-index:60;
  color:rgba(148,163,184,.75);font-size:11px;pointer-events:none
}

/* MOBILE OVERRIDES — NO OVERLAP GUARANTEED */
@media(max-width:720px){
  .minimap{width:120px !important;height:76px !important;top:54px;right:8px}
  .chat-wrap{top:54px;left:8px;width:min(230px,58vw)}
  .chat-float{top:54px;left:8px}
  .joy{left:10px !important;bottom:14px !important}
  .keys{display:none}
  .chip{font-size:11px;padding:6px 10px}
  .icon-btn{width:34px;height:34px;font-size:15px}
}
@media(max-width:380px){
  .minimap{width:95px !important;height:60px !important}
  .chat-wrap{width:min(200px,55vw)}
}

/* No avatar overlay */
.overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(2,6,23,.95);
  display:none;align-items:center;justify-content:center;
  padding:20px;text-align:center
}
.overlay.show{display:flex}
.overlay .card{
  max-width:400px;background:#0f172a;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:26px
}
.overlay h2{margin:0 0 8px;font-size:20px}
.overlay p{color:#94a3b8;margin:0 0 18px;font-size:13px;line-height:1.5}
.overlay a{
  display:inline-block;padding:11px 20px;border-radius:11px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  color:#fff;font-weight:700;text-decoration:none
}
</style>
</head>
<body>

<div id="game">
  <canvas id="map"></canvas>
  <div id="players"></div>
</div>

<!-- ========== TOP HUD — ALL BUTTONS HERE, NEVER OVERLAPPED ========== -->
<div class="hud">
  <div class="group">
    <div class="chip">🗺️ <span id="wc">0</span> · <b id="mn">—</b></div>
    <div class="chip" id="ping">● connecting</div>
  </div>
  <div class="group">
    <button class="icon-btn on" id="tchat" title="Show/Hide Chat">💬</button>
    <button class="icon-btn" id="sbtn" title="Settings">⚙</button>
  </div>
</div>

<!-- MINIMAP TOP RIGHT (below HUD) -->
<div class="minimap" id="mmbox">
  <canvas id="mm" width="360" height="225"></canvas>
  <div class="lbl">MAP</div>
</div>

<!-- CHAT TOP LEFT (below HUD) -->
<div class="chat-wrap" id="cw">
  <div class="log" id="log"></div>
  <form class="chatbar" id="cf" autocomplete="off">
    <input id="ci" type="text" maxlength="80" placeholder="Type message…">
    <button type="submit">➤</button>
  </form>
</div>
<button class="chat-float" id="tchat2" style="display:none">💬<span class="badge" id="unread">0</span></button>

<!-- JOYSTICK -->
<div class="joy" id="joy"><div class="nub" id="nub"></div></div>
<div class="keys">WASD / Arrows · Enter = Chat</div>

<!-- SETTINGS MODAL — 4 WORKING SLIDERS -->
<div class="modal" id="modal">
  <div class="card">
    <h3>⚙ Settings</h3>
    <p class="sub">Adjust to your screen. Saves automatically.</p>

    <div class="set-row">
      <label>Joystick Size <span class="val" id="jsv">130px</span></label>
      <input id="jsize" type="range" min="80" max="210" value="130">
    </div>

    <div class="set-row">
      <label>View Distance <span class="val" id="vdv">100%</span></label>
      <input id="vdist" type="range" min="60" max="180" value="100">
    </div>

    <div class="set-row">
      <label>Chat Background <span class="val" id="cov">65%</span></label>
      <input id="cop" type="range" min="20" max="100" value="65">
    </div>

    <div class="set-row">
      <label>Minimap Size <span class="val" id="msv">160px</span></label>
      <input id="msize" type="range" min="90" max="240" value="160">
    </div>

    <div class="actions">
      <button class="reset" id="rset">Reset</button>
      <button class="save" id="msave">Done</button>
    </div>
  </div>
</div>

<!-- NO AVATAR REDIRECT -->
<div class="overlay" id="ov">
  <div class="card">
    <h2>🎨 Draw first</h2>
    <p>Make your avatar on the main page first. Redirecting…</p>
    <a href="/">Draw Page →</a>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const avatar = sessionStorage.getItem('avatar');
  const myName = sessionStorage.getItem('name');
  const ov = document.getElementById('ov');

  if (!avatar || !myName) {
    ov.classList.add('show');
    setTimeout(() => location.href = '/', 1800);
    return;
  }
  document.getElementById('mn').textContent = myName;

  // ========== ALL 4 SETTINGS — working + saved ==========
  const DEFAULTS = { joySize:130, viewDist:100, chatAlpha:65, mapSize:160 };
  const cfg = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('dw_cfg3')||'{}'));
  const joy = document.getElementById('joy'), nub = document.getElementById('nub');
  const mmbox = document.getElementById('mmbox');
  const cw = document.getElementById('cw');

  function applyCfg(){
    // Joystick
    joy.style.width  = cfg.joySize+'px';
    joy.style.height = cfg.joySize+'px';
    const ns = Math.round(cfg.joySize*0.42);
    nub.style.width  = ns+'px';
    nub.style.height = ns+'px';
    nub.style.margin = (-ns/2)+'px 0 0 '+(-ns/2)+'px';
    document.getElementById('jsv').textContent = cfg.joySize+'px';
    document.getElementById('jsize').value = cfg.joySize;

    // View distance
    document.getElementById('vdv').textContent = cfg.viewDist+'%';
    document.getElementById('vdist').value = cfg.viewDist;

    // Chat opacity
    const a = cfg.chatAlpha/100;
    cw.style.setProperty('--chat-alpha', a.toFixed(2));
    cw.style.setProperty('--chat-border', Math.min(.18, a*0.14).toFixed(2));
    document.getElementById('cov').textContent = cfg.chatAlpha+'%';
    document.getElementById('cop').value = cfg.chatAlpha;

    // Minimap (16:10)
    mmbox.style.width  = cfg.mapSize+'px';
    mmbox.style.height = Math.round(cfg.mapSize*0.63)+'px';
    document.getElementById('msv').textContent = cfg.mapSize+'px';
    document.getElementById('msize').value = cfg.mapSize;
  }
  function save(){ localStorage.setItem('dw_cfg3', JSON.stringify(cfg)); }
  applyCfg();

  // ========== CHAT TOGGLE — 100% working ==========
  let chatOn = true, unread = 0;
  const tchat1 = document.getElementById('tchat');
  const tchat2 = document.getElementById('tchat2');
  const unreadEl = document.getElementById('unread');

  function setChat(on){
    chatOn = on;
    cw.classList.toggle('hidden', !on);
    tchat1.classList.toggle('on', on);
    if(on){ unread = 0; unreadEl.textContent = '0'; }
  }
  tchat1.onclick = () => setChat(!chatOn);
  tchat2.onclick = () => setChat(true);
  document.addEventListener('keydown', e => {
    if(e.key === '/' && document.activeElement?.id !== 'ci'){ e.preventDefault(); setChat(!chatOn); }
  });

  // ========== SETTINGS MODAL BINDINGS ==========
  document.getElementById('sbtn').onclick = () => document.getElementById('modal').classList.add('open');
  document.getElementById('msave').onclick = () => { save(); document.getElementById('modal').classList.remove('open'); };
  document.getElementById('rset').onclick = () => { Object.assign(cfg, DEFAULTS); applyCfg(); save(); };
  document.getElementById('modal').onclick = e => { if(e.target.id==='modal'){save();document.getElementById('modal').classList.remove('open');} };
  document.getElementById('jsize').oninput = e => { cfg.joySize  = +e.target.value; applyCfg(); };
  document.getElementById('vdist').oninput = e => { cfg.viewDist = +e.target.value; applyCfg(); };
  document.getElementById('cop').oninput   = e => { cfg.chatAlpha= +e.target.value; applyCfg(); };
  document.getElementById('msize').oninput = e => { cfg.mapSize  = +e.target.value; applyCfg(); };

  // ========== CANVAS / STATIC WORLD ==========
  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  const mmCanvas = document.getElementById('mm');
  const mmCtx = mmCanvas.getContext('2d');
  const playersEl = document.getElementById('players');
  const logEl = document.getElementById('log');
  const pingEl = document.getElementById('ping');
  const wcEl = document.getElementById('wc');

  let MAP_W=3200, MAP_H=2000, rocks=[], selfId=null;
  const players = new Map();
  const camera = { x: MAP_W/2, y: MAP_H/2 };
  const keys = new Set();
  let input = {x:0,y:0};

  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const worldCanvas = document.createElement('canvas');
  let worldCtx = null;

  function rr(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r); c.closePath();
  }
  function drawRockOnWorld(r){
    worldCtx.fillStyle='rgba(0,0,0,.22)';
    worldCtx.beginPath(); worldCtx.ellipse(r.x+r.w/2+5, r.y+r.h+6, r.w/2, 11, 0, 0, Math.PI*2); worldCtx.fill();
    const g = worldCtx.createLinearGradient(r.x,r.y,r.x,r.y+r.h);
    g.addColorStop(0,'#9ca3af'); g.addColorStop(1,'#4b5563');
    worldCtx.fillStyle=g; rr(worldCtx,r.x,r.y,r.w,r.h,14); worldCtx.fill();
    worldCtx.fillStyle='rgba(255,255,255,.2)';
    rr(worldCtx,r.x+7,r.y+7,r.w-14,r.h*0.34,10); worldCtx.fill();
    worldCtx.strokeStyle='rgba(31,41,55,.5)'; worldCtx.lineWidth=1.5;
    worldCtx.beginPath();
    worldCtx.moveTo(r.x+r.w*0.3, r.y+8); worldCtx.lineTo(r.x+r.w*0.36, r.y+r.h*0.72);
    worldCtx.moveTo(r.x+r.w*0.66, r.y+r.h*0.22); worldCtx.lineTo(r.x+r.w*0.72, r.y+r.h-10);
    worldCtx.stroke();
  }
  function buildWorld(){
    worldCanvas.width=MAP_W; worldCanvas.height=MAP_H;
    worldCtx = worldCanvas.getContext('2d');
    worldCtx.fillStyle='#4ade80'; worldCtx.fillRect(0,0,MAP_W,MAP_H);
    for(let i=0;i<Math.floor(MAP_W*MAP_H/900);i++){
      const x=Math.random()*MAP_W, y=Math.random()*MAP_H;
      worldCtx.fillStyle = Math.random()<0.6 ? '#22c55e' : '#16a34a';
      worldCtx.fillRect(x,y,2,3);
    }
    for(let i=0;i<420;i++){
      const x=Math.random()*MAP_W, y=Math.random()*MAP_H;
      worldCtx.fillStyle=['#fef3c7','#fecaca','#fbcfe8','#ddd6fe'][i%4];
      worldCtx.fillRect(x,y,2,2);
    }
    for(let i=0;i<85;i++){
      const x=Math.random()*MAP_W, y=Math.random()*MAP_H, r=18+Math.random()*32;
      worldCtx.fillStyle='rgba(180,130,80,.25)';
      worldCtx.beginPath(); worldCtx.arc(x,y,r,0,Math.PI*2); worldCtx.fill();
    }
    worldCtx.strokeStyle='rgba(21,128,61,.9)'; worldCtx.lineWidth=8;
    worldCtx.strokeRect(4,4,MAP_W-8,MAP_H-8);
    worldCtx.strokeStyle='rgba(250,204,21,.45)'; worldCtx.lineWidth=14;
    worldCtx.strokeRect(0,0,MAP_W,MAP_H);
    rocks.forEach(drawRockOnWorld);
  }

  // ========== MAIN RENDER ==========
  function render(){
    const me = players.get(selfId);
    if (me) { camera.x+=(me.x-camera.x)*0.12; camera.y+=(me.y-camera.y)*0.12; }

    const vf = cfg.viewDist/100;
    const vw = canvas.width / vf;
    const vh = canvas.height / vf;
    const vx = Math.max(0, Math.min(MAP_W - vw, camera.x - vw/2));
    const vy = Math.max(0, Math.min(MAP_H - vh, camera.y - vh/2));

    if (worldCtx) ctx.drawImage(worldCanvas, vx,vy,vw,vh, 0,0,canvas.width,canvas.height);

    // Players + single bubble
    playersEl.innerHTML='';
    const sx = canvas.width/vw, sy = canvas.height/vh;
    players.forEach(p => {
      const sxp = (p.x-vx)*sx, syp = (p.y-vy)*sy;
      if(sxp<-80||sxp>canvas.width+80||syp<-80||syp>canvas.height+80) return;
      const el=document.createElement('div');
      el.className='player'+(p.id===selfId?' me':'');
      el.style.left = sxp+'px'; el.style.top = syp+'px';
      el.style.transform = `translate(-50%,-50%) scale(${1/vf})`;
      el.innerHTML=`<img class="av" src="${p.avatar}" alt=""><div class="nm">${escapeHtml(p.name)}</div>`;
      if(p.bubble){
        const b = document.createElement('div');
        b.className = 'bubble' + (p.bubble.fading?' fading':'');
        b.textContent = p.bubble.text;
        el.appendChild(b);
      }
      playersEl.appendChild(el);
    });

    drawMinimap(vx,vy,vw,vh);
    requestAnimationFrame(render);
  }

  function drawMinimap(vx,vy,vw,vh){
    const W=mmCanvas.width, H=mmCanvas.height, sx=W/MAP_W, sy=H/MAP_H;
    mmCtx.fillStyle='#166534'; mmCtx.fillRect(0,0,W,H);
    mmCtx.fillStyle='#22c55e'; mmCtx.fillRect(1,1,W-2,H-2);
    mmCtx.fillStyle='#6b7280';
    rocks.forEach(r => mmCtx.fillRect(r.x*sx, r.y*sy, Math.max(2,r.w*sx), Math.max(2,r.h*sy)));
    players.forEach(p => {
      mmCtx.fillStyle = p.id===selfId ? '#facc15' : '#3b82f6';
      mmCtx.beginPath(); mmCtx.arc(p.x*sx,p.y*sy,p.id===selfId?3.5:2.5,0,Math.PI*2); mmCtx.fill();
    });
    mmCtx.strokeStyle='rgba(255,255,255,.9)'; mmCtx.lineWidth=1;
    mmCtx.strokeRect(vx*sx, vy*sy, Math.min(W,vw*sx), Math.min(H,vh*sy));
  }

  setInterval(() => { if((input.x||input.y)&&selfId) socket.emit('move',{dx:input.x,dy:input.y}); }, 1000/60);
  // ========== JOYSTICK ==========
  let jActive=false,jId=null,jcx=0,jcy=0;
  function jStart(e){
    const t=e.touches?e.touches[0]:e;
    if(e.touches) jId=e.touches[0].identifier;
    jActive=true; const r=joy.getBoundingClientRect();
    jcx=r.left+r.width/2; jcy=r.top+r.height/2; jMove(t);
  }
  function jMove(t){
    if(!jActive) return;
    let dx=t.clientX-jcx, dy=t.clientY-jcy;
    const d=Math.hypot(dx,dy), max=cfg.joySize*0.33;
    if(d>max){dx=(dx/d)*max; dy=(dy/d)*max;}
    nub.style.transform=`translate(${dx}px,${dy}px)`;
    input.x=dx/max; input.y=dy/max;
  }
  function jEnd(){jActive=false;jId=null;nub.style.transform='translate(0,0)';input.x=0;input.y=0;}
  joy.addEventListener('touchstart',e=>{e.preventDefault();jStart(e)},{passive:false});
  joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jId){jMove(t);break;}},{passive:false});
  joy.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===jId){jEnd();break;}});
  joy.addEventListener('mousedown',jStart);
  window.addEventListener('mousemove',e=>{if(jActive)jMove(e)});
  window.addEventListener('mouseup',()=>{if(jActive)jEnd()});

  // ========== KEYBOARD ==========
  addEventListener('keydown',e=>{
    if(e.key === 'Enter'){
      const ci = document.getElementById('ci');
      if(document.activeElement === ci){
        if(ci.value.trim()) document.getElementById('cf').dispatchEvent(new Event('submit'));
        ci.blur();
      } else {
        if(!chatOn) setChat(true);
        ci.focus(); ci.select();
      }
      e.preventDefault();
      return;
    }
    if(e.key === 'Escape'){
      if(document.activeElement?.id === 'ci') document.getElementById('ci').blur();
      if(document.getElementById('modal').classList.contains('open')){save();document.getElementById('modal').classList.remove('open');}
      return;
    }
    if(document.activeElement?.tagName === 'INPUT') return;
    keys.add(e.key.toLowerCase()); updateKeys();
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  });
  addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase()); updateKeys();});
  function updateKeys(){
    let x=0,y=0;
    if(keys.has('w')||keys.has('arrowup')) y-=1;
    if(keys.has('s')||keys.has('arrowdown')) y+=1;
    if(keys.has('a')||keys.has('arrowleft')) x-=1;
    if(keys.has('d')||keys.has('arrowright')) x+=1;
    const l=Math.hypot(x,y)||1;
    input.x=x/l; input.y=y/l;
  }

  // ========== SCROLLABLE CHAT (Roblox style — no fade) ==========
  document.getElementById('cf').addEventListener('submit',e=>{
    e.preventDefault();
    const inp=document.getElementById('ci'), v=inp.value.trim();
    if(!v) return;
    socket.emit('chat', v);
    inp.value='';
  });
  function addChat(name,msg,isSys=false){
    const m=document.createElement('div');
    m.className='msg'+(isSys?' sys':'');
    m.innerHTML=`<b>${escapeHtml(name)}:</b> ${escapeHtml(msg)}`;
    logEl.appendChild(m);
    // Cap + auto scroll to bottom
    while(logEl.children.length > 120) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
    // Unread badge if chat hidden
    if(!chatOn){ unread++; unreadEl.textContent = unread > 99 ? '99+' : unread; }
  }

  // ========== SINGLE BUBBLE ONLY ==========
  function setBubble(pid, text){
    const p = players.get(pid); if(!p) return;
    p.bubble = { text, fading:false };
    clearTimeout(p._bt);
    p._bt = setTimeout(() => {
      if(p.bubble){
        p.bubble.fading = true;
        setTimeout(() => { p.bubble = null; }, 350);
      }
    }, 4500);
  }

  // ========== SOCKET ==========
  const socket = io({ transports:['websocket','polling'] });
  let lastPing=Date.now();
  socket.on('connect',()=>{
    pingEl.innerHTML='<span style="color:#4ade80">●</span> ok';
    socket.emit('join',{name:myName,avatar});
    setInterval(()=>{lastPing=Date.now();socket.emit('ping',()=>{
      const ms=Date.now()-lastPing;
      pingEl.innerHTML=`<span style="color:#4ade80">●</span> ${ms}ms`;
    });},3000);
  });
  socket.on('disconnect',()=>pingEl.innerHTML='<span style="color:#f87171">●</span> off');
  socket.on('connect_error',()=>pingEl.innerHTML='<span style="color:#fbbf24">●</span> …');
  socket.on('init',d=>{
    selfId=d.selfId; MAP_W=d.mapW; MAP_H=d.mapH; rocks=d.rocks||[];
    camera.x=MAP_W/2; camera.y=MAP_H/2;
    buildWorld();
    d.players.forEach(p=>players.set(p.id,{...p,bubble:null}));
    wcEl.textContent=players.size;
    requestAnimationFrame(render);
    addChat('🌍','Welcome '+myName+'! Press Enter to chat.',true);
  });
  socket.on('playerJoin',p=>{players.set(p.id,{...p,bubble:null});wcEl.textContent=players.size;addChat('👋',p.name+' joined',true);});
  socket.on('pos',({id,x,y})=>{const p=players.get(id);if(p){p.x=x;p.y=y;}});
  socket.on('chatMsg',({id,name,msg})=>{
    addChat(name,msg);
    setBubble(id, msg);
  });
  socket.on('leave',id=>{const p=players.get(id);if(p)addChat('🚪',p.name+' left',true);players.delete(id);wcEl.textContent=players.size;});

  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
})();
</script>
</body>
</html>
